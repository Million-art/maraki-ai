services:
  - type: web
    name: tg-bot
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
