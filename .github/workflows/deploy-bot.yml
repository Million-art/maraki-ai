name: Deploy Maraki Bot to AWS EC2

on:
  push:
    branches: [ main, v3, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Repository Name to Lowercase
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build TypeScript Natively & Prepare Production Dependencies
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image (Multi-Arch: AMD64 & ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/maraki-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Pre-built Container to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.CR_PAT || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30m
          command_timeout: 30m
          envs: TKN,NODE_ENV,WEBHOOK_URL,BACKEND_API_URL,DATABASE_URL,REDIS_URL,GEMINI_API_KEY,REPO_LOWER,ACTOR,GH_TOKEN
          script: |
            # Authenticate with GHCR on EC2
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u $ACTOR --password-stdin

            # Detect project and configuration directories on EC2
            COMPOSE_DIR="/home/${{ secrets.SERVER_USER }}/carramarket"
            if [ ! -d "$COMPOSE_DIR" ]; then
              COMPOSE_DIR="/home/${{ secrets.SERVER_USER }}/remittance-backend"
            fi

            TARGET_DIR="$COMPOSE_DIR/compliance-backend"
            mkdir -p "$TARGET_DIR"

            WEBHOOK_URL_VAL="${{ secrets.WEBHOOK_URL }}"
            if [ -z "$WEBHOOK_URL_VAL" ] || [[ "$WEBHOOK_URL_VAL" == *"alertmanager.ptgr.io"* ]]; then
              WEBHOOK_URL_VAL="https://alert.carramarket.com/webhook"
            fi

            # Auto-generate or update .env from GitHub Secrets if TKN is set, or if .env does not exist
            if [ -n "${{ secrets.TKN }}" ]; then
              cat << EOF > "$TARGET_DIR/.env"
TKN=${{ secrets.TKN }}
PORT=1000
NODE_ENV=${{ secrets.NODE_ENV || 'production' }}
WEBHOOK_URL=$WEBHOOK_URL_VAL
BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}
DATABASE_URL=${{ secrets.DATABASE_URL }}
REDIS_URL=${{ secrets.REDIS_URL }}
GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
CRON_SECRET=${{ secrets.CRON_SECRET }}
EOF
            elif [ ! -f "$TARGET_DIR/.env" ]; then
              cat << EOF > "$TARGET_DIR/.env"
PORT=1000
NODE_ENV=production
WEBHOOK_URL=$WEBHOOK_URL_VAL
EOF
            fi

            # Pull latest pre-compiled image
            echo "Pulling container image: ghcr.io/$REPO_LOWER/maraki-bot:latest..."
            sudo docker pull ghcr.io/$REPO_LOWER/maraki-bot:latest

            # Deploy using Docker Compose if docker-compose.yml exists
            if [ -f "$COMPOSE_DIR/docker-compose.yml" ]; then
              echo "Deploying compliance-backend via Docker Compose in $COMPOSE_DIR..."
              cd "$COMPOSE_DIR"
              if sudo docker compose version >/dev/null 2>&1; then
                sudo docker compose pull compliance-backend
                sudo docker compose up -d --no-deps compliance-backend
              elif command -v docker-compose >/dev/null 2>&1; then
                sudo docker-compose pull compliance-backend
                sudo docker-compose up -d --no-deps compliance-backend
              else
                echo "Docker Compose command not found, using fallback docker run..."
              fi
            fi

            # Standalone fallback if container is not running under Compose
            if ! sudo docker ps --format '{{.Names}}' | grep -q "^compliance-backend$"; then
              echo "Starting standalone compliance-backend container..."
              sudo docker stop compliance-backend 2>/dev/null || true
              sudo docker rm compliance-backend 2>/dev/null || true

              # Resolve Docker network attached to Nginx Gateway
              DOCKER_NET=$(sudo docker inspect gateway --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' 2>/dev/null)
              if [ -z "$DOCKER_NET" ]; then
                DOCKER_NET=$(sudo docker network ls --format '{{.Name}}' | grep -E 'bid-network|raffle-network|ptgr-network|remittance|carramarket|nginx' | head -n 1)
              fi

              NET_FLAG=""
              if [ -n "$DOCKER_NET" ]; then
                echo "Connecting to EC2 network: $DOCKER_NET"
                NET_FLAG="--network $DOCKER_NET"
              fi

              sudo docker run -d \
                --name compliance-backend \
                --restart always \
                $NET_FLAG \
                -p 1000:1000 \
                -e VIRTUAL_HOST=alert.carramarket.com \
                -e VIRTUAL_PORT=1000 \
                --env-file "$TARGET_DIR/.env" \
                ghcr.io/$REPO_LOWER/maraki-bot:latest

              if [ -n "$DOCKER_NET" ]; then
                sudo docker network connect "$DOCKER_NET" compliance-backend 2>/dev/null || true
              fi
            fi

            # Reload gateway Nginx proxy if running
            sudo docker exec gateway nginx -s reload 2>/dev/null || true

            # Remove legacy cron watchdog if present (Docker / Compose restart: always handles restarts natively)
            (crontab -l 2>/dev/null | grep -v "compliance-backend" || true) | crontab -

            echo "✅ Deployment successful! compliance-backend is running."
