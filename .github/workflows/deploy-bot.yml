name: Deploy Maraki Bot to AWS EC2

on:
  push:
    branches: [ main, v3, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Repository Name to Lowercase
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image (Pre-compiled)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/maraki-bot:latest

      - name: Deploy Pre-built Container to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30m
          command_timeout: 30m
          envs: TKN,NODE_ENV,WEBHOOK_URL,BACKEND_API_URL,DATABASE_URL,REDIS_URL,GEMINI_API_KEY,REPO_LOWER,ACTOR,GH_TOKEN
          script: |
            # Authenticate with GHCR on EC2
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u $ACTOR --password-stdin

            # Create hidden directory structure
            mkdir -p /home/${{ secrets.SERVER_USER }}/remittance-backend/compliance-backend
            cd /home/${{ secrets.SERVER_USER }}/remittance-backend/compliance-backend

            # Auto-generate .env from GitHub Secrets
            cat << EOF > .env
            TKN=${{ secrets.TKN }}
            PORT=1000
            NODE_ENV=${{ secrets.NODE_ENV || 'production' }}
            WEBHOOK_URL=${{ secrets.WEBHOOK_URL || 'https://alertmanager.ptgr.io/webhook' }}
            BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}
            EOF

            # Pull latest pre-compiled image
            echo "Pulling container image..."
            sudo docker pull ghcr.io/$REPO_LOWER/maraki-bot:latest

            # Stop and remove existing container if running
            echo "Stopping old compliance-backend process..."
            sudo docker stop compliance-backend || true
            sudo docker rm compliance-backend || true

            # Automatically resolve target Docker network attached to Nginx Gateway
            DOCKER_NET=$(sudo docker inspect gateway --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' 2>/dev/null)
            if [ -z "$DOCKER_NET" ]; then
              DOCKER_NET=$(sudo docker network ls --format '{{.Name}}' | grep -E 'raffle-network|ptgr-network|remittance|carramarket|nginx' | head -n 1)
            fi

            NET_FLAG=""
            if [ -n "$DOCKER_NET" ]; then
              echo "Connecting to EC2 network: $DOCKER_NET"
              NET_FLAG="--network $DOCKER_NET"
            fi

            # Run pre-compiled container attached to Gateway network on Port 1000
            echo "Starting compliance-backend container on Port 1000..."
            sudo docker run -d \
              --name compliance-backend \
              --restart unless-stopped \
              $NET_FLAG \
              -p 1000:1000 \
              -e VIRTUAL_HOST=alertmanager.ptgr.io \
              -e VIRTUAL_PORT=1000 \
              --env-file /home/${{ secrets.SERVER_USER }}/remittance-backend/compliance-backend/.env \
              ghcr.io/$REPO_LOWER/maraki-bot:latest

            # Reload gateway Nginx proxy if running
            sudo docker exec gateway nginx -s reload 2>/dev/null || true

            # Setup Auto-Healing Watchdog
            CRON_CMD="* * * * * sudo docker ps | grep -q compliance-backend || sudo docker run -d --name compliance-backend --restart unless-stopped $NET_FLAG -p 1000:1000 -e VIRTUAL_HOST=alertmanager.ptgr.io -e VIRTUAL_PORT=1000 --env-file /home/${{ secrets.SERVER_USER }}/remittance-backend/compliance-backend/.env ghcr.io/$REPO_LOWER/maraki-bot:latest"
            (crontab -l 2>/dev/null | grep -v "compliance-backend"; echo "$CRON_CMD") | crontab -

            echo "✅ Deployment successful! Container joined network: $DOCKER_NET."
