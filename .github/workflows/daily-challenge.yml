name: Daily Challenge Broadcast

on:
  schedule:
    # 5:00 AM UTC = 8:00 AM EAT (Africa/Addis_Ababa, UTC+3)
    - cron: '0 5 * * *'
  # Allow manual trigger from GitHub Actions UI for testing
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Daily Challenge Broadcast
        run: |
          URL="${{ secrets.BOT_API_URL }}"
          if [ -z "$URL" ] || [[ "$URL" == *"alertmanager.ptgr.io"* ]]; then
            URL="https://alert.carramarket.com"
          fi
          if [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://$URL"
          fi

          # Capture both the HTTP status code and the response body
          HTTP_STATUS=$(curl -s --location-trusted -w "%{http_code}" -o response_body.json \
            -X POST "$URL/cron/daily-challenge" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "Response status: $HTTP_STATUS"
          echo "Response body:"
          cat response_body.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Broadcast failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Daily challenge broadcast triggered successfully"
